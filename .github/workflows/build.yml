name: Build exhibition

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1" # Mondays, to refresh "On view" and other museum details
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the page from the Harvard Art Museums API
        run: python3 build.py
        env:
          HAM_API_KEY: ${{ secrets.HAM_API_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
